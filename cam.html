
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <title>Worldwide Live CCTV</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090d12;
      color: #e8edf2;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #111923;
      border-bottom: 1px solid #273443;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      color: #9baaba;
      font-size: 13px;
    }

    main {
      padding: 16px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 14px;
    }

    .camera-card {
      min-width: 0;
      overflow: hidden;
      background: #121a24;
      border: 1px solid #273443;
      border-radius: 8px;
    }

    .camera-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
    }

    .camera-title {
      font-weight: bold;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .camera-location {
      margin-top: 4px;
      color: #9baaba;
      font-size: 12px;
    }

    .status {
      flex-shrink: 0;
      color: #f0c674;
      font-size: 10px;
      white-space: nowrap;
    }

    .status.live {
      color: #60dc91;
    }

    .status.error {
      color: #ff7777;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    video,
    .camera-image,
    .camera-mjpeg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      border: 0;
    }

    .message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #b7c3d0;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.35);
    }

    .message.hidden {
      display: none;
    }

    footer {
      padding: 18px;
      color: #8290a0;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    footer a {
      color: #8dc7ff;
    }

    @media (max-width: 500px) {
      main {
        padding: 9px;
      }

      .camera-grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Worldwide Live CCTV</h1>
    <p>Public live streams · Updated Often</p>
  </header>

  <main>
    <div class="camera-grid" id="cameraGrid"></div>
  </main>

  <footer>
    Video streams may be delayed or unavailable.
    Snapshot cameras refresh automatically when supported by their provider.
    <br>
    If a camera is not loading, try refreshing:
    <a href="cam.html">Refresh</a>
  </footer>

  <script>
    /*
    ==========================================================
    ADD CAMERAS HERE
    ==========================================================

    HLS VIDEO:
      type: "hls"
      url: "https://example.com/playlist.m3u8"

    MP4 VIDEO:
      type: "mp4"
      url: "https://example.com/camera.mp4"

    MJPEG VIDEO:
      type: "mjpeg"
      url: "https://example.com/camera.mjpg"

    SNAPSHOT IMAGE:
      type: "image"
      url: "https://example.com/camera.jpeg"
      refreshSeconds: 10

    Copy a camera object and change its details.
    Add a comma between camera objects.
    ==========================================================
    */

    const cameras = [
      {
        type: "hls",
        name: "Minnesota Traffic Camera",
        location: "Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C75-02.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "MD AVE @ I-95 NB EXIT",
        location: "Wilmington, Delaware, United States",
        url: "https://video.deldot.gov/live/NCAM154.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "T.H.75 NB @ 12th Ave",
        location: "Moorhead, Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C75-06.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "I-35W SB S of 106th St",
        location: "Bloomington, Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C610.stream/playlist.m3u8"
      },
      {
        type: "mp4",
        name: "Rotherhithe Tunnel Barrier N",
        location: "London, England, United Kingdom",
        url: "https://s3-eu-west-1.amazonaws.com/jamcams.tfl.gov.uk/00002.00422.mp4"
      },
      {
        type: "hls",
        name: "I-95 South of DE 141",
        location: "New Castle County, Delaware, United States",
        url: "https://video.deldot.gov/live/NCAM008.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "I-94 WB @ Co Rd 21 (Stagecoach Trl)",
        location: "1 mile west of Lakeland, Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C868.stream/playlist.m3u8"
      },
      {
        type: "image",
        name: "Brisbane Street",
        location: "Tamworth, New South Wales, Australia",
        url: "https://webcams.transport.nsw.gov.au/livetraffic-webcams/cameras/brisbane_street_tamworth.jpeg",
        refreshSeconds: 10
      },
      {
        type: "hls",
        name: "Düsseldorf Airport — Airfield Camera",
        location: "Düsseldorf Airport, Germany",
        url: "https://stream-5gw.1000eyes.de/cupertino/dused0c.stream/chunklist.m3u8"
      },
      {
        type: "mp4",
        name: "Edgware Rd / Madia Ave",
        location: "London, England, United Kingdom",
        url: "https://s3-eu-west-1.amazonaws.com/jamcams.tfl.gov.uk/00001.08861.mp4"
      },
      {
        type: "hls",
        name: "I-5 (116) Brookhurst Street",
        location: "Orange, California, United States",
        url: "https://wzmedia.dot.ca.gov/D12/NB5Brookhurst.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "Hamburg Airport Runway Activity",
        location: "Hamburg, Germany",
        url: "https://stream-5gw.1000eyes.de/cupertino/hamDDFB28.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "Fa’a’ā International Airport Webcam",
        location: "Faʻaʻā, French Polynesia",
        url: "https://s40.ipcamlive.com/streams/283gqcojyeifda6sl/stream.m3u8"
      },
      {
        type: "hls",
        name: "Düsseldorf Airport Runway Action",
        location: "Düsseldorf, North Rhine-Westphalia, Germany",
        url: "https://stream-5gw.1000eyes.de/cupertino/dus5abb.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "Düsseldorf Airport Runway Action 2",
        location: "Düsseldorf, North Rhine-Westphalia, Germany",
        url: "https://stream-5gw.1000eyes.de/cupertino/dusfcae.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "NY27 at Sandy Hollow Road (CR52)",
        location: "Calverton, New York, United States",
        url: "https://s7.nysdot.skyvdn.com/rtplive/R10_383/playlist.m3u8"
      }

      // Add more camera objects here.
    ];

    const grid = document.getElementById("cameraGrid");
    const players = [];

    function createCamera(camera, index) {
      const card = document.createElement("section");
      card.className = "camera-card";

      const heading = document.createElement("div");
      heading.className = "camera-heading";

      const details = document.createElement("div");

      const title = document.createElement("div");
      title.className = "camera-title";
      title.textContent = camera.name || "Unnamed camera";

      const location = document.createElement("div");
      location.className = "camera-location";
      location.textContent = camera.location || "Location unknown";

      details.append(title, location);

      const status = document.createElement("span");
      status.className = "status";
      status.textContent = "CONNECTING";

      heading.append(details, status);

      const container = document.createElement("div");
      container.className = "video-container";

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = "Connecting…";

      container.append(message);
      card.append(heading, container);
      grid.append(card);

      let hls = null;
      let media = null;
      let refreshTimer = null;
      let retryTimer = null;
      let generation = 0;
      let retryCount = 0;
      let recoveryUsed = false;

      function setStatus(text, type = "") {
        status.textContent = text;
        status.className = "status";
        if (type) status.classList.add(type);
      }

      function showMessage(text) {
        message.textContent = text;
        message.classList.remove("hidden");
      }

      function hideMessage() {
        message.classList.add("hidden");
      }

      function clearTimers() {
        if (refreshTimer) clearInterval(refreshTimer);
        if (retryTimer) clearTimeout(retryTimer);
        refreshTimer = null;
        retryTimer = null;
      }

      function destroyPlayer() {
        generation++;
        clearTimers();

        if (hls) {
          hls.destroy();
          hls = null;
        }

        if (media) {
          if (media.tagName === "VIDEO") {
            media.pause();
            media.removeAttribute("src");
            media.load();
          }

          media.remove();
          media = null;
        }
      }

      function showError(text) {
        setStatus("ERROR", "error");
        showMessage(text);
        console.warn(`[${camera.name}] ${text}`);
      }

      function validateUrl() {
        try {
          const parsed = new URL(camera.url);
          return parsed.protocol === "https:" ||
                 parsed.protocol === "http:";
        } catch {
          return false;
        }
      }

      function reconnect() {
        destroyPlayer();
        retryCount = 0;
        recoveryUsed = false;
        setStatus("CONNECTING");
        showMessage("Connecting…");
        startCamera();
      }

      function startCamera() {
        if (!validateUrl()) {
          showError("Invalid or missing camera URL.");
          return;
        }

        const currentGeneration = generation;

        if (camera.type === "image") {
          startSnapshot(currentGeneration);
        } else if (camera.type === "mjpeg") {
          startMjpeg(currentGeneration);
        } else if (camera.type === "mp4") {
          startVideo(currentGeneration, "mp4");
        } else if (camera.type === "hls") {
          startVideo(currentGeneration, "hls");
        } else {
          showError(`Unsupported camera type: ${camera.type}`);
        }
      }

      // IMAGE SNAPSHOT
      function startSnapshot(currentGeneration) {
        const image = document.createElement("img");
        image.className = "camera-image";
        image.alt = camera.name || "Camera snapshot";
        image.decoding = "async";
        media = image;

        container.insertBefore(image, message);

        let firstLoad = true;
        let requestInProgress = false;

        function refreshSnapshot() {
          if (currentGeneration !== generation || requestInProgress) {
            return;
          }

          requestInProgress = true;

          const nextImage = new Image();
          const separator = camera.url.includes("?") ? "&" : "?";
          nextImage.src = camera.url + separator + "_=" + Date.now();

          nextImage.onload = () => {
            requestInProgress = false;
            if (currentGeneration !== generation) return;

            image.src = nextImage.src;
            setStatus("LIVE SNAPSHOT", "live");
            hideMessage();
            firstLoad = false;
          };

          nextImage.onerror = () => {
            requestInProgress = false;
            if (currentGeneration !== generation) return;

            if (firstLoad) {
              showError(
                "Snapshot unavailable. The image may be offline or blocked."
              );
            } else {
              setStatus("STALE SNAPSHOT", "error");
            }
          };
        }

        refreshSnapshot();

        const seconds = Math.max(
          5,
          Number(camera.refreshSeconds) || 10
        );

        refreshTimer = setInterval(refreshSnapshot, seconds * 1000);
      }

      // MJPEG CONTINUOUS IMAGE STREAM
      function startMjpeg(currentGeneration) {
        const image = document.createElement("img");
        image.className = "camera-mjpeg";
        image.alt = camera.name || "MJPEG camera";
        media = image;

        image.addEventListener("load", () => {
          if (currentGeneration !== generation) return;
          setStatus("CONNECTED", "live");
          hideMessage();
        });

        image.addEventListener("error", () => {
          if (currentGeneration !== generation) return;
          showError(
            "MJPEG stream unavailable or blocked by the provider."
          );
        });

        container.insertBefore(image, message);
        image.src = camera.url;
      }

      // MP4 AND HLS VIDEO
      function startVideo(currentGeneration, kind) {
        const video = document.createElement("video");

        video.autoplay = true;
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.controls = false;
        video.preload = "auto";
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("aria-label", camera.name || "Camera video");

        media = video;
        container.insertBefore(video, message);

        video.addEventListener("playing", () => {
          if (currentGeneration !== generation) return;

          retryCount = 0;
          setStatus("PLAYING", "live");
          hideMessage();
        });

        video.addEventListener("waiting", () => {
          if (currentGeneration !== generation) return;
          setStatus("BUFFERING");
        });

        video.addEventListener("stalled", () => {
          if (currentGeneration !== generation) return;
          setStatus("STALLED");
        });

        video.addEventListener("error", () => {
          if (currentGeneration !== generation) return;

          const errorCode = video.error ? video.error.code : 0;

          showError(
            `${kind.toUpperCase()} playback error ` +
            `(${errorCode || "unknown"}). The stream may be offline or blocked.`
          );
        });

        function attemptAutoplay() {
          if (currentGeneration !== generation || media !== video) return;

          video.play().then(() => {
            if (currentGeneration !== generation) return;
            hideMessage();
          }).catch(() => {
            if (currentGeneration !== generation) return;

            setStatus("RETRYING");
            showMessage("Waiting for video playback…");

            // Retry a few times, but don't create an endless retry loop.
            if (retryCount < 3) {
              retryCount++;

              retryTimer = setTimeout(
                attemptAutoplay,
                2000 * retryCount
              );
            } else {
              setStatus("PLAY BLOCKED");
              showMessage(
                "Autoplay was blocked by the browser or the stream could not start."
              );
            }
          });
        }

        if (kind === "mp4") {
          video.src = camera.url;
          video.load();
          attemptAutoplay();
          return;
        }

        // Native HLS playback where available.
        if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = camera.url;
          attemptAutoplay();
          return;
        }

        // HLS playback through hls.js for browsers such as Chrome and Edge.
        if (!window.Hls || !Hls.isSupported()) {
          showError("HLS playback is not supported in this browser.");
          return;
        }

        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 30,
          maxBufferLength: 20,
          manifestLoadingMaxRetry: 3,
          levelLoadingMaxRetry: 3,
          fragLoadingMaxRetry: 3,
          manifestLoadingRetryDelay: 1000,
          levelLoadingRetryDelay: 1000,
          fragLoadingRetryDelay: 1000
        });

        hls.on(Hls.Events.MEDIA_ATTACHED, () => {
          if (currentGeneration !== generation || !hls) return;
          hls.loadSource(camera.url);
        });

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (currentGeneration !== generation) return;
          attemptAutoplay();
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (currentGeneration !== generation || !hls) return;

          console.warn(
            `[${camera.name}] HLS error:`,
            data.type,
            data.details
          );

          if (!data.fatal) return;

          if (
            data.type === Hls.ErrorTypes.NETWORK_ERROR &&
            retryCount < 2
          ) {
            retryCount++;
            setStatus(`RETRY ${retryCount}/2`);
            showMessage("Connection failed. Retrying…");

            retryTimer = setTimeout(() => {
              if (
                currentGeneration === generation &&
                hls
              ) {
                hls.startLoad();
              }
            }, 1500 * retryCount);

            return;
          }

          if (
            data.type === Hls.ErrorTypes.MEDIA_ERROR &&
            !recoveryUsed
          ) {
            recoveryUsed = true;
            setStatus("RECOVERING");
            showMessage("Recovering video playback…");

            hls.recoverMediaError();
            return;
          }

          showError(
            "HLS stream failed: " +
            (data.details || data.type || "unknown error")
          );

          hls.destroy();
          hls = null;
        });

        // Stagger startup to reduce the initial network burst.
        retryTimer = setTimeout(() => {
          if (currentGeneration !== generation || !hls) return;
          hls.attachMedia(video);
        }, index * 250);
      }

      startCamera();

      players.push({
        reconnect,
        stop: destroyPlayer
      });
    }

    cameras.forEach(createCamera);

    // Release resources when the page is being unloaded.
    window.addEventListener("pagehide", () => {
      players.forEach(player => player.stop());
    });
  </script>
</body>
</html>
