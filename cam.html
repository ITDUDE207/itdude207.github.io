<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worldwide Live CCTV</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090d12;
      color: #e8edf2;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #111923;
      border-bottom: 1px solid #273443;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      color: #9baaba;
      font-size: 13px;
    }

    main {
      padding: 16px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 14px;
    }

    .camera-card {
      min-width: 0;
      overflow: hidden;
      background: #121a24;
      border: 1px solid #273443;
      border-radius: 8px;
    }

    .camera-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
    }

    .camera-title {
      font-weight: bold;
      font-size: 14px;
    }

    .camera-location {
      margin-top: 4px;
      color: #9baaba;
      font-size: 12px;
    }

    .status {
      flex-shrink: 0;
      color: #f0c674;
      font-size: 11px;
      white-space: nowrap;
    }

    .status.live {
      color: #60dc91;
    }

    .status.error {
      color: #ff7777;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video,
    .camera-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #b7c3d0;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-align: center;
      pointer-events: none;
    }

    .message.hidden {
      display: none;
    }

    footer {
      padding: 18px;
      color: #8290a0;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 500px) {
      main {
        padding: 9px;
      }

      .camera-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Worldwide Live CCTV</h1>
    <p>Public live streams · Updated Often</p>
  </header>

  <main>
    <div class="camera-grid" id="cameraGrid"></div>
  </main>

  <footer>
    Video streams may be delayed or unavailable.
    Snapshot cameras refresh automatically when supported by their provider.
    If it is not loading, try refreshing your page: <a href='cam.html'>Refresh</a>
  </footer>

  <script>
    /*
    ==========================================================
    ADD CAMERAS HERE
    ==========================================================

    VIDEO CAMERA:
      type: "hls"
      url: "https://example.com/playlist.m3u8"

    IMAGE/SNAPSHOT CAMERA:
      type: "image"
      url: "https://example.com/camera.jpeg"
      refreshSeconds: 10

    Copy a camera block and change its details.
    Add a comma between camera blocks.
    get the feeds from https://opencctv.org/
    ==========================================================
    */

    const cameras = [
      {
        type: "hls",
        name: "Minnesota Traffic Camera",
        location: "Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C75-02.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "MD AVE @ I-95 NB EXIT",
        location: "Wilmington, Delaware, United States",
        url: "https://video.deldot.gov/live/NCAM154.stream/playlist.m3u8"
      },
       {
        type: "hls",
        name: "T.H.75 NB @ 12th Ave",
        location: "in Moorhead, Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C75-06.stream/playlist.m3u8"
      },
      {
        type: "hls",
        name: "I-35W SB S of 106th St",
        location: "in Bloomington, Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C610.stream/playlist.m3u8"
      },
    {
        type: "mp4",
        name: "Rotherhithe Tunnel Barrier N",
        location: "London, England, United Kingdom",
        url: "https://s3-eu-west-1.amazonaws.com/jamcams.tfl.gov.uk/00002.00422.mp4"
      },
      {
        type: "hls",
        name: "I 95 @ SOUTH OF DE 141",
        location: "New Castle County, Delaware, United States",
        url: "https://video.deldot.gov/live/NCAM008.stream/playlist.m3u8"
      },

      {
        type: "hls",
        name: "I-94 WB @ Co Rd 21 (Stagecoach Trl)",
        location: "1 mile west of Lakeland, Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C868.stream/playlist.m3u8"
      },

      // CAMERA 4 — TAMWORTH, AUSTRALIA
      {
        type: "image",
        name: "Brisbane Street",
        location: "Tamworth, New South Wales, Australia",
        url: "https://webcams.transport.nsw.gov.au/livetraffic-webcams/cameras/brisbane_street_tamworth.jpeg",
        refreshSeconds: 10
      },
      {
        type: "hls",
        name: "Düsseldorf Airport — airfield camera",
        location: "Düsseldorf Airport",
        url: "https://stream-5gw.1000eyes.de/cupertino/dused0c.stream/chunklist.m3u8",

      },
       {
        type: "mp4",
        name: "Edgeware Rd/Madia Ave",
        location: "London, England, United Kingdom",
        url: "https://s3-eu-west-1.amazonaws.com/jamcams.tfl.gov.uk/00001.08861.mp4",
        
      },
      {
        type: "hls",
        name: "I-5 : (116) Brookhurst Street",
        location: "Orange, California, United States",
        url: "https://wzmedia.dot.ca.gov/D12/NB5Brookhurst.stream/playlist.m3u8",

      },
      {
        type: "hls",
        name: "Hamburg Airport Runway Activity",
        location: "Hamburg, Hamburg, Germany",
        url: "https://stream-5gw.1000eyes.de/cupertino/hamDDFB28.stream/playlist.m3u8",

      },
      {
        type: "hls",
        name: "Fa’a’ā International Airport Webcam",
        location: "Faʻaʻā, French Polynesia",
        url: "https://s40.ipcamlive.com/streams/283gqcojyeifda6sl/stream.m3u8",

      },
      {
        type: "hls",
        name: "Düsseldorf Airport Runway Action",
        location: "Düsseldorf, North Rhine-Westphalia, Germany",
        url: "https://stream-5gw.1000eyes.de/cupertino/dus5abb.stream/playlist.m3u8",

      },
      {
        type: "hls",
        name: "Düsseldorf Airport Runway Action 2",
        location: "Düsseldorf, North Rhine-Westphalia, Germany",
        url: "https://stream-5gw.1000eyes.de/cupertino/dusfcae.stream/playlist.m3u8",

      },
      {
        type: "hls",
        name: "NY27 at Sandy Hollow Road (CR52)",
        location: "Calverton, New York, United States",
        url: "https://s7.nysdot.skyvdn.com/rtplive/R10_383/playlist.m3u8",

      },
      {
        type: "hls",
        name: "Sandestin Beach",
        location: "Destin, Florida, United States",
        url: "https://videos-3.earthcam.com/fecnetwork/17089.flv/playlist.m3u8",

      },
      {
        type: "hls",
        name: "Montgomery Regional Airport Live Airfield",
        location: "Montgomery, Alabama, United States",
        url: "https://s47.ipcamlive.com/streams/2fr8yifrmiolslqx7/stream.m3u8",

      },
      {
        type: "hls",
        name: "Rivershore Estate Golf Links",
        location: "Kamloops, British Columbia, Canada",
        url: "https://s134.ipcamlive.com/streams/866fej9tqviqlv1gx/stream.m3u8",

      }
      // ADD MORE CAMERAS HERE.
      // For an image, use type: "image".
      // For a video, use type: "hls".
    ];

    const grid = document.getElementById("cameraGrid");

    function bustUrl(url) {
      return url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
    }

    function createCamera(camera, index) {
      const card = document.createElement("section");
      card.className = "camera-card";

      const heading = document.createElement("div");
      heading.className = "camera-heading";

      const details = document.createElement("div");

      const title = document.createElement("div");
      title.className = "camera-title";
      title.textContent = camera.name;

      const location = document.createElement("div");
      location.className = "camera-location";
      location.textContent = camera.location;

      details.append(title, location);

      const status = document.createElement("span");
      status.className = "status";
      status.textContent = "CONNECTING";

      heading.append(details, status);

      const container = document.createElement("div");
      container.className = "video-container";

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = "Connecting…";

      container.append(message);
      card.append(heading, container);
      grid.append(card);

      function setStatus(text, type = "") {
        status.textContent = text;
        status.className = "status";

        if (type) status.classList.add(type);
      }

      function showMessage(text) {
        message.textContent = text;
        message.classList.remove("hidden");
      }

      // IMAGE CAMERA
      if (camera.type === "image") {
        const image = document.createElement("img");
        image.className = "camera-image";
        image.alt = camera.name;
        image.loading = "eager";
        image.decoding = "async";

        image.addEventListener("load", () => {
          setStatus("LIVE SNAPSHOT", "live");
          message.classList.add("hidden");
        });

        image.addEventListener("error", () => {
          setStatus("ERROR", "error");
          showMessage("Snapshot unavailable. The image may be offline or blocked.");
        });

        container.insertBefore(image, message);

        function refreshImage() {
          image.src = bustUrl(camera.url);
        }

        refreshImage();

        const seconds = Math.max(5, Number(camera.refreshSeconds) || 10);
        setInterval(refreshImage, seconds * 1000);

        return;
      }

      // DIRECT MP4 CAMERA
      if (camera.type === "mp4") {
        if (!camera.url || !/^https?:\/\//i.test(camera.url)) {
          setStatus("ERROR", "error");
          showMessage("Invalid camera URL.");
          return;
        }

        const video = document.createElement("video");
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.controls = false;
        video.preload = "auto";
        video.setAttribute("aria-label", camera.name);

        container.insertBefore(video, message);

        function loadDirectVideo() {
          video.src = bustUrl(camera.url);
          video.load();
          video.play().catch(() => {
            setStatus("ERROR", "error");
            showMessage("Direct video playback failed. The stream may be unavailable.");
            setTimeout(loadDirectVideo, 8000);
          });
        }

        video.addEventListener("playing", () => {
          setStatus("PLAYING", "live");
          message.classList.add("hidden");
        });

        video.addEventListener("waiting", () => {
          setStatus("BUFFERING");
        });

        video.addEventListener("error", () => {
          setStatus("ERROR", "error");
          showMessage("Video unavailable. This stream may be offline or blocked.");
          setTimeout(loadDirectVideo, 8000);
        });

        loadDirectVideo();
        return;
      }

      // HLS VIDEO CAMERA
      const video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.controls = false;
      video.preload = "auto";
      video.setAttribute("aria-label", camera.name);

      container.insertBefore(video, message);

      let hls = null;
      let retryCount = 0;
      let recoveryUsed = false;
      let failed = false;
      let retryTimer = null;

      function destroyHls() {
        if (hls) {
          try { hls.destroy(); } catch (e) {}
          hls = null;
        }
      }

      function startHls() {
        if (!camera.url || !/^https?:\/\//i.test(camera.url)) {
          showError("Invalid camera URL.");
          return;
        }

        destroyHls();

        if (!window.Hls || !Hls.isSupported()) {
          showError("HLS playback is not supported in this browser.");
          return;
        }

        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          maxBufferLength: 20,
          manifestLoadingMaxRetry: 2,
          levelLoadingMaxRetry: 2,
          fragLoadingMaxRetry: 2
        });

        hls.on(Hls.Events.MEDIA_ATTACHED, () => {
          hls.loadSource(bustUrl(camera.url));
        });

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {
            showError("Autoplay failed. Check browser playback settings.");
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error(`${camera.name} HLS error:`, data.type, data.details, data);

          if (!data.fatal || failed || !hls) return;

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retryCount < 3) {
            retryCount++;
            setStatus(`RETRY ${retryCount}/3`);
            showMessage("Connection failed. Retrying…");
            setTimeout(() => {
              if (hls && !failed) hls.startLoad();
            }, 1500 * retryCount);
            return;
          }

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !recoveryUsed) {
            recoveryUsed = true;
            setStatus("RECOVERING");
            showMessage("Recovering video playback…");
            hls.recoverMediaError();
            return;
          }

          showError("Stream failed: " + (data.details || data.type || "Unknown HLS error"));
          destroyHls();
          if (retryTimer) clearTimeout(retryTimer);
          retryTimer = setTimeout(() => {
            retryTimer = null;
            startHls();
          }, 8000);
        });

        hls.attachMedia(video);
      }

      function showError(text) {
        failed = true;
        setStatus("ERROR", "error");
        showMessage(text);
        console.error(`${camera.name}: ${text}`);
      }

      video.addEventListener("playing", () => {
        failed = false;
        retryCount = 0;
        recoveryUsed = false;
        setStatus("PLAYING", "live");
        message.classList.add("hidden");
      });

      video.addEventListener("waiting", () => {
        if (!failed) setStatus("BUFFERING");
      });

      video.addEventListener("error", () => {
        if (!failed) {
          showError("Browser playback error. Check the stream URL and server response.");
        }
        if (retryTimer) clearTimeout(retryTimer);
        retryTimer = setTimeout(() => {
          retryTimer = null;
          startHls();
        }, 8000);
      });

      if (!camera.url || !/^https?:\/\//i.test(camera.url)) {
        showError("Invalid camera URL.");
        return;
      }

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = bustUrl(camera.url);
        video.play().catch(() => {
          showError("Playback failed. The stream may be unavailable.");
          if (retryTimer) clearTimeout(retryTimer);
          retryTimer = setTimeout(() => {
            retryTimer = null;
            video.src = bustUrl(camera.url);
            video.load();
            video.play().catch(() => {});
          }, 8000);
        });
        return;
      }

      startHls();

      setTimeout(() => {
        if (hls) {
          setStatus("CONNECTING");
        }
      }, index * 300);
    }

    cameras.forEach(createCamera);
  </script>
</body>
</html>
