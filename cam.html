
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worldwide Live CCTV</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090d12;
      color: #e8edf2;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #111923;
      border-bottom: 1px solid #273443;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      color: #9baaba;
      font-size: 13px;
    }

    main {
      padding: 16px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 14px;
    }

    .camera-card {
      min-width: 0;
      overflow: hidden;
      background: #121a24;
      border: 1px solid #273443;
      border-radius: 8px;
    }

    .camera-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
    }

    .camera-title {
      font-weight: bold;
      font-size: 14px;
    }

    .camera-location {
      margin-top: 4px;
      color: #9baaba;
      font-size: 12px;
    }

    .status {
      flex-shrink: 0;
      color: #f0c674;
      font-size: 11px;
      white-space: nowrap;
    }

    .status.live {
      color: #60dc91;
    }

    .status.error {
      color: #ff7777;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video,
    .camera-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #b7c3d0;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-align: center;
      pointer-events: none;
    }

    .message.hidden {
      display: none;
    }

    footer {
      padding: 18px;
      color: #8290a0;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 500px) {
      main {
        padding: 9px;
      }

      .camera-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Worldwide Live CCTV</h1>
    <p>Public live streams · Automatic grid · No video controls</p>
  </header>

  <main>
    <div class="camera-grid" id="cameraGrid"></div>
  </main>

  <footer>
    Video streams may be delayed or unavailable.
    Snapshot cameras refresh automatically when supported by their provider.
  </footer>

  <script>
    /*
    ==========================================================
    ADD CAMERAS HERE
    ==========================================================

    VIDEO CAMERA:
      type: "hls"
      url: "https://example.com/playlist.m3u8"

    IMAGE/SNAPSHOT CAMERA:
      type: "image"
      url: "https://example.com/camera.jpeg"
      refreshSeconds: 10

    Copy a camera block and change its details.
    Add a comma between camera blocks.
    ==========================================================
    */

    const cameras = [
      {
        type: "hls",
        name: "Minnesota Traffic Camera",
        location: "Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C75-02.stream/playlist.m3u8"
      },
    {
        type: "mp4",
        name: "Rotherhithe Tunnel Barrier N",
        location: "London, England, United Kingdom",
        url: "https://s3-eu-west-1.amazonaws.com/jamcams.tfl.gov.uk/00002.00422.mp4"
      },
      {
        type: "hls",
        name: "I 95 @ SOUTH OF DE 141",
        location: "New Castle County, Delaware, United States",
        url: "https://video.deldot.gov/live/NCAM008.stream/playlist.m3u8"
      },

      {
        type: "hls",
        name: "I-94 WB @ Co Rd 21 (Stagecoach Trl)",
        location: "1 mile west of Lakeland, Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C868.stream/playlist.m3u8"
      },

      // CAMERA 4 — TAMWORTH, AUSTRALIA
      {
        type: "image",
        name: "Brisbane Street",
        location: "Tamworth, New South Wales, Australia",
        url: "https://webcams.transport.nsw.gov.au/livetraffic-webcams/cameras/brisbane_street_tamworth.jpeg",
        refreshSeconds: 10
      },
      {
        type: "hls",
        name: "Düsseldorf Airport — airfield camera",
        location: "Düsseldorf Airport",
        url: "https://stream-5gw.1000eyes.de/cupertino/dused0c.stream/chunklist.m3u8",

      },
       {
        type: "mp4",
        name: "Edgeware Rd/Madia Ave",
        location: "London, England, United Kingdom",
        url: "https://s3-eu-west-1.amazonaws.com/jamcams.tfl.gov.uk/00001.08861.mp4",
        
      },
      // ADD MORE CAMERAS HERE.
      // For an image, use type: "image".
      // For a video, use type: "hls".
    ];

    const grid = document.getElementById("cameraGrid");

    function createCamera(camera, index) {
      const card = document.createElement("section");
      card.className = "camera-card";

      const heading = document.createElement("div");
      heading.className = "camera-heading";

      const details = document.createElement("div");

      const title = document.createElement("div");
      title.className = "camera-title";
      title.textContent = camera.name;

      const location = document.createElement("div");
      location.className = "camera-location";
      location.textContent = camera.location;

      details.append(title, location);

      const status = document.createElement("span");
      status.className = "status";
      status.textContent = "CONNECTING";

      heading.append(details, status);

      const container = document.createElement("div");
      container.className = "video-container";

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = "Connecting…";

      container.append(message);
      card.append(heading, container);
      grid.append(card);

      function setStatus(text, type = "") {
        status.textContent = text;
        status.className = "status";

        if (type) status.classList.add(type);
      }

      function showMessage(text) {
        message.textContent = text;
        message.classList.remove("hidden");
      }

      // IMAGE CAMERA
      if (camera.type === "image") {
        const image = document.createElement("img");
        image.className = "camera-image";
        image.alt = camera.name;
        image.loading = "eager";
        image.decoding = "async";

        let hasLoaded = false;

        image.addEventListener("load", () => {
          hasLoaded = true;
          setStatus("LIVE SNAPSHOT", "live");
          message.classList.add("hidden");
        });

        image.addEventListener("error", () => {
          setStatus("ERROR", "error");
          showMessage("Snapshot unavailable. The image may be offline or blocked.");
        });

        container.insertBefore(image, message);

        function refreshImage() {
          // Cache-busting query parameter requests a fresh snapshot.
          const separator = camera.url.includes("?") ? "&" : "?";
          image.src = camera.url + separator + "_=" + Date.now();
        }

        refreshImage();

        const seconds = Math.max(5, Number(camera.refreshSeconds) || 10);
        setInterval(refreshImage, seconds * 1000);

        return;
      }

      // HLS VIDEO CAMERA
      const video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.controls = false;
      video.preload = "auto";
      video.setAttribute("aria-label", camera.name);

      container.insertBefore(video, message);

      let hls = null;
      let retryCount = 0;
      let recoveryUsed = false;
      let failed = false;

      function showError(text) {
        failed = true;
        setStatus("ERROR", "error");
        showMessage(text);
        console.error(`[${camera.name}] ${text}`);
      }

      video.addEventListener("playing", () => {
        failed = false;
        retryCount = 0;
        setStatus("PLAYING", "live");
        message.classList.add("hidden");
      });

      video.addEventListener("waiting", () => {
        if (!failed) setStatus("BUFFERING");
      });

      video.addEventListener("error", () => {
        if (!failed) {
          showError("Browser playback error. Check the stream URL and server response.");
        }
      });

      if (!camera.url || !/^https?:\/\//i.test(camera.url)) {
        showError("Invalid camera URL.");
        return;
      }

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = camera.url;

        video.play().catch(() => {
          showError("Playback failed. The stream may be unavailable.");
        });

        return;
      }

      if (!window.Hls || !Hls.isSupported()) {
        showError("HLS playback is not supported in this browser.");
        return;
      }

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30,
        maxBufferLength: 20,
        manifestLoadingMaxRetry: 2,
        levelLoadingMaxRetry: 2,
        fragLoadingMaxRetry: 2
      });

      hls.on(Hls.Events.MEDIA_ATTACHED, () => {
        hls.loadSource(camera.url);
      });

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {
          showError("Autoplay failed. Check browser playback settings.");
        });
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        console.error(
          `[${camera.name}] HLS error:`,
          data.type,
          data.details,
          data
        );

        if (!data.fatal || failed || !hls) return;

        if (
          data.type === Hls.ErrorTypes.NETWORK_ERROR &&
          retryCount < 2
        ) {
          retryCount++;
          setStatus(`RETRY ${retryCount}/2`);
          showMessage("Connection failed. Retrying…");

          setTimeout(() => {
            if (hls && !failed) hls.startLoad();
          }, 1500 * retryCount);

          return;
        }

        if (
          data.type === Hls.ErrorTypes.MEDIA_ERROR &&
          !recoveryUsed
        ) {
          recoveryUsed = true;
          setStatus("RECOVERING");
          showMessage("Recovering video playback…");
          hls.recoverMediaError();
          return;
        }

        showError(
          "Stream failed: " +
          (data.details || data.type || "Unknown HLS error")
        );

        hls.destroy();
        hls = null;
      });

      // Stagger startup slightly; each camera still has its own player.
      setTimeout(() => {
        if (hls) {
          setStatus("CONNECTING");
          hls.attachMedia(video);
        }
      }, index * 300);
    }

    cameras.forEach(createCamera);
  </script>
</body>
</html>
