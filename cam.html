
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worldwide Live CCTV</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090d12;
      color: #e8edf2;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #111923;
      border-bottom: 1px solid #273443;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      color: #9baaba;
      font-size: 13px;
    }

    main {
      padding: 16px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 14px;
    }

    .camera-card {
      min-width: 0;
      overflow: hidden;
      background: #121a24;
      border: 1px solid #273443;
      border-radius: 8px;
    }

    .camera-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
    }

    .camera-title {
      font-weight: bold;
      font-size: 14px;
    }

    .camera-location {
      margin-top: 4px;
      color: #9baaba;
      font-size: 12px;
    }

    .status {
      color: #f0c674;
      font-size: 11px;
      white-space: nowrap;
    }

    .status.live {
      color: #60dc91;
    }

    .video-container {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #b7c3d0;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }

    .message.hidden {
      display: none;
    }

    footer {
      padding: 18px;
      color: #8290a0;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 500px) {
      main {
        padding: 9px;
      }

      .camera-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Worldwide Live CCTV</h1>
    <p>Public live streams · Automatic grid · No video controls</p>
  </header>

  <main>
    <div class="camera-grid" id="cameraGrid"></div>
  </main>

  <footer>
    Streams may be delayed, offline, or restricted by their providers.
  </footer>

  <script>
    /*
    ==========================================================
    ADD CAMERAS HERE
    ==========================================================

    To add a camera:
    1. Copy one complete camera block below.
    2. Paste it underneath the existing block.
    3. Change name, location and url.

    The URL should be a direct, browser-accessible HLS stream,
    usually ending in .m3u8.

    Remember to include a comma between camera blocks.
    ==========================================================
    */

    const cameras = [

      // CAMERA 1 — MINNESOTA, USA
      {
        name: "Minnesota Traffic Camera",
        location: "Minnesota, United States",
        url: "https://video.dot.state.mn.us/public/C75-02.stream/playlist.m3u8"
      },

      // COPY THIS BLOCK TO ADD ANOTHER CAMERA
      // Replace the example details with a real stream URL.
      /*
      {
        name: "Your New Camera",
        location: "London, United Kingdom",
        url: "https://example.com/live/playlist.m3u8"
      },
      */

      // PASTE MORE CAMERA BLOCKS HERE

    ];

    const grid = document.getElementById("cameraGrid");

    function createCamera(camera) {
      const card = document.createElement("section");
      card.className = "camera-card";

      const heading = document.createElement("div");
      heading.className = "camera-heading";

      const details = document.createElement("div");

      const title = document.createElement("div");
      title.className = "camera-title";
      title.textContent = camera.name;

      const location = document.createElement("div");
      location.className = "camera-location";
      location.textContent = camera.location;

      details.append(title, location);

      const status = document.createElement("span");
      status.className = "status";
      status.textContent = "CONNECTING";

      heading.append(details, status);

      const container = document.createElement("div");
      container.className = "video-container";

      const video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.controls = false;
      video.setAttribute("aria-label", camera.name);

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = "Connecting to stream…";

      container.append(video, message);
      card.append(heading, container);
      grid.append(card);

      function showMessage(text) {
        message.textContent = text;
        message.classList.remove("hidden");
      }

      function markPlaying() {
        status.textContent = "PLAYING";
        status.classList.add("live");
        message.classList.add("hidden");
      }

      video.addEventListener("playing", markPlaying);

      video.addEventListener("waiting", () => {
        status.textContent = "BUFFERING";
        status.classList.remove("live");
      });

      video.addEventListener("error", () => {
        status.textContent = "ERROR";
        status.classList.remove("live");
        showMessage("Video failed to load. The stream may be offline or unsupported.");
      });

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = camera.url;

        video.play().catch(() => {
          showMessage("Waiting for the video stream…");
        });

      } else if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30
        });

        hls.loadSource(camera.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {
            showMessage("Playback was blocked by the browser.");
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            status.textContent = "UNAVAILABLE";
            status.classList.remove("live");
            showMessage(
              "Could not load this stream. It may be offline or block browser access."
            );
            hls.destroy();
          }
        });

      } else {
        status.textContent = "UNSUPPORTED";
        showMessage("This browser does not support HLS playback.");
      }
    }

    cameras.forEach(createCamera);
  </script>
</body>
</html>
