<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚨 LEVEL UP: UNWINNABLE BUTTON 🚨</title>
    <style>
        body {
            background-color: #0d0d13;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
            margin-bottom: 5px;
        }

        .hud {
            font-size: 1.2rem;
            color: #00ff66;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* The moving arena container */
        .game-area {
            position: relative;
            width: 700px;
            height: 500px;
            border: 3px dashed #ff3333;
            background-color: #12121a;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(255, 51, 51, 0.2);
        }

        /* Base class for all buttons (Real and Fake Clones) */
        .arcade-btn {
            position: absolute;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
        }

        /* The real target button */
        #evade-btn {
            background: linear-gradient(135deg, #ff0055, #990033);
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            transition: all 0.1s ease-out; 
            left: 280px;
            top: 220px;
            z-index: 5;
        }

        /* The dummy copycat buttons */
        .decoy-btn {
            background: linear-gradient(135deg, #ff4500, #b22222);
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.3);
            opacity: 0.9;
        }

        /* Flashy win state overlay */
        .win-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .win-screen h2 {
            font-size: 4rem;
            color: #00ff66;
            text-shadow: 0 0 20px #00ff66;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>BOSS FIGHT PHASE</h1>
    <div class="hud">DODGES: <span id="score">0</span> | PHASE: <span id="phase-txt">1 (Warmup)</span></div>

    <!-- The containment grid for our button -->
    <div class="game-area">
        <button id="evade-btn" class="arcade-btn">CLICK ME</button>
    </div>

    <!-- Hidden victory screen for the persistent clicker -->
    <div id="victory" class="win-screen">
        <h2>IMPOSSIBLE!! 🧙‍♂️</h2>
        <p style="margin-top: 20px; font-size: 1.5rem;">You hacked the sound barrier and clicked it!</p>
        <button onclick="location.reload()" style="padding: 15px 30px; font-size: 1.2rem; cursor: pointer; background: #00ff66; border: none; font-weight: bold;">Re-Contain System</button>
    </div>

    <script>
        const btn = document.getElementById('evade-btn');
        const area = document.querySelector('.game-area');
        const scoreBoard = document.getElementById('score');
        const phaseTxt = document.getElementById('phase-txt');
        
        let dodgeCount = 0;
        let audioCtx = null;

        // 🔊 Pure Synth Sound Generator (Requires zero external files!)
        function playEscapeSound(frequency, duration, type = 'sawtooth') {
            try {
                // Initialize modern web audio context on user interaction rules
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                // Rapidly down-pitch the note over time for a comic laser/alarm slide effect
                osc.frequency.exponentialRampToValueAtTime(frequency / 3, audioCtx.currentTime + duration);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime); // Volume safety limit
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log("Audio waiting for explicit click context override.");
            }
        }

        // 🎭 Decoy Creator: Multiplies fake targets across the mesh layout grid
        function spawnDecoy() {
            const decoy = document.createElement('button');
            decoy.className = 'arcade-btn decoy-btn';
            decoy.innerText = 'CLICK ME';
            
            // Randomly position decoy inside boundaries
            const maxX = area.clientWidth - 130;
            const maxY = area.clientHeight - 50;
            decoy.style.left = `${Math.floor(Math.random() * maxX)}px`;
            decoy.style.top = `${Math.floor(Math.random() * maxY)}px`;
            
            // Mocking logic: Clicking a dummy plays an error buzz and moves it out of spite
            decoy.addEventListener('mouseover', () => {
                playEscapeSound(180, 0.15, 'triangle'); // Dull low error tone
                decoy.style.left = `${Math.floor(Math.random() * maxX)}px`;
                decoy.style.top = `${Math.floor(Math.random() * maxY)}px`;
            });
            
            decoy.addEventListener('click', () => {
                alert("❌ Wrong button! That was a phantom decoy!");
                decoy.remove();
            });

            area.appendChild(decoy);
        }

        // 🏃 Main Target Movement Engine
        btn.addEventListener('mouseover', () => {
            dodgeCount++;
            scoreBoard.innerText = dodgeCount;

            const maxX = area.clientWidth - btn.clientWidth;
            const maxY = area.clientHeight - btn.clientHeight;
            let randomX = Math.floor(Math.random() * maxX);
            let randomY = Math.floor(Math.random() * maxY);

            // Phase Upgrades
            if (dodgeCount <= 5) {
                // Phase 1: High pitch quick bleep
                playEscapeSound(800, 0.1, 'sine');
                phaseTxt.innerText = "1 (Warmup)";
            } 
            else if (dodgeCount > 5 && dodgeCount <= 12) {
                // Phase 2: Retro laser slide + Scale shifts
                playEscapeSound(1200, 0.2, 'sawtooth');
                btn.style.transform = `scale(${Math.random() * (1.4 - 0.7) + 0.7})`;
                phaseTxt.innerText = "2 (Size Shifter)";
                
                // Spawn one decoy if missing
                if (document.querySelectorAll('.decoy-btn').length < 2) {
                    spawnDecoy();
                }
            } 
            else {
                // Phase 3: Ultra Alarm sound + Flooding clones everywhere
                playEscapeSound(2000, 0.3, 'square');
                phaseTxt.innerText = "3 (💥 DECOY FLOOD 💥)";
                
                // Keep spawning decoys up to a total density limit of 8 entries
                if (document.querySelectorAll('.decoy-btn').length < 8) {
                    spawnDecoy();
                    spawnDecoy();
                }

                // Activate intermittent phase tangibility shields
                if (Math.random() > 0.4) {
                    btn.style.pointerEvents = 'none';
                    btn.innerText = "SHIELD ACTIVE";
                    setTimeout(() => {
                        btn.style.pointerEvents = 'auto';
                        btn.innerText = "CLICK ME";
                    }, 450);
                }
            }

            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;
        });

        // The absolute miracle click detection rule
        btn.addEventListener('click', () => {
            document.getElementById('victory').style.display = 'flex';
        });
    </script>

</body>
</html>
