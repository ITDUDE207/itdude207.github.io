<!DOCTYPE html>
<html>
<head>
    <title>🤖 Captcha</title>
    <style>
        body { background: #0d0d13; color: #fff; font-family: monospace; text-align: center; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #box { width: 380px; background: #12121a; border: 2px solid #333; padding: 20px; border-radius: 8px; box-shadow: 0 10px 30px #000; }
        #arena { position: relative; width: 100%; height: 160px; background: #0a0a0f; border: 1px dashed #556; overflow: hidden; margin: 15px 0; display: flex; align-items: center; justify-content: center; }
        .tgt { position: absolute; cursor: pointer; }
        .btn { background: #00ff66; color: #000; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        progress { width: 100%; height: 10px; accent-color: #ff3366; }
    </style>
</head>
<body>

    <h2>SCORE: <span id="score">0</span></h2>
    <div id="box">
        <div id="prompt">Click Start to begin verification...</div>
        <div id="arena"><button class="btn" onclick="start()">START</button></div>
        <progress id="tm" value="100" max="100"></progress>
    </div>

    <script>
        const pr = document.getElementById('prompt'), ar = document.getElementById('arena'), tm = document.getElementById('tm'), sb = document.getElementById('score');
        let sc = 0, tl = 100, ti = null, type = '', cnt = 0;
        const tasks = [
            { id: 'box', txt: 'Check the box to confirm humanity.' },
            { id: 'run', txt: 'Hover over the tag to verify coordinates.' },
            { id: 'btn', txt: 'Quick! Click the button labeled BOOP!' }
        ];

        function start() { sc = 0; sb.innerText = 0; round(); }

        function round() {
            ar.innerHTML = ''; tl = 100; tm.value = 100; cnt = 0;
            clearInterval(ti);
            ti = setInterval(() => { tl -= (2 + sc * 0.3); tm.value = tl; if (tl <= 0) die(); }, 100);

            const t = tasks[Math.floor(Math.random() * tasks.length)];
            pr.innerText = t.txt; type = t.id;
            build();
        }

        function rnd(max) { return Math.floor(Math.random() * max); }

        function build() {
            if (type === 'box') {
                const el = Object.assign(document.createElement('label'), { className: 'tgt', innerHTML: '<input type="checkbox"> I am human', style: 'left:110px; top:70px;' });
                el.addEventListener('mouseenter', () => { el.style.left = rnd(240) + 'px'; el.style.top = rnd(130) + 'px'; });
                el.querySelector('input').addEventListener('change', () => { sc++; sb.innerText = sc; round(); });
                ar.appendChild(el);
            } 
            else if (type === 'run') {
                const el = Object.assign(document.createElement('div'), { className: 'tgt', innerText: 'VERIFY', style: 'left:140px; top:65px; background:#ff3366; padding:6px; font-weight:bold;' });
                el.addEventListener('mouseenter', () => {
                    el.style.left = rnd(300) + 'px'; el.style.top = rnd(130) + 'px';
                    if (++cnt > 4) { sc++; sb.innerText = sc; round(); }
                });
                ar.appendChild(el);
            } 
            else if (type === 'btn') {
                ['BEEP', 'BOOP', 'BLIP'].sort(() => Math.random() - 0.5).forEach((txt, i) => {
                    const el = Object.assign(document.createElement('button'), { className: 'btn tgt', innerText: txt, style: `left:${20 + i * 110}px; top:65px;` });
                    el.addEventListener('click', () => { if (txt === 'BOOP') { sc++; sb.innerText = sc; round(); } else die(); });
                    ar.appendChild(el);
                });
            }
        }

        function die() {
            clearInterval(ti);
            pr.innerText = '❌ SECURITY FAILURE!';
            ar.innerHTML = `<button class="btn" style="background:#ff3366" onclick="start()">RETRY</button>`;
        }
    </script>
</body>
</html>
