<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🌊 Viscous Slime Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050508; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
        let W, H, agents = [], trailMap, nextMap;
        let mx = -1000, my = -1000, isMouseDown = false;

        // 🧠 Slime Behavior Tuning Variables
        const NUM_AGENTS = 5000;
        const SENSOR_ANGLE = 0.45;  // Radar check angle (radians)
        const SENSOR_DIST = 10;     // Forward look-ahead distance
        const TURN_SPEED = 0.3;     // Steering velocity scalar
        const AGENT_SPEED = 2.2;    // Forward stride step

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            
            // Allocate 1D Typed Float Array matrix to hold chemical density footprints
            trailMap = new Float32Array(W * H);
            nextMap = new Float32Array(W * H);

            // Populate initial circular cluster of autonomous goo particles
            agents = [];
            for (let i = 0; i < NUM_AGENTS; i++) {
                let ang = Math.random() * Math.PI * 2;
                let r = Math.random() * 80;
                agents.push({
                    x: W / 2 + Math.cos(ang) * r,
                    y: H / 2 + Math.sin(ang) * r,
                    heading: Math.random() * Math.PI * 2
                });
            }
        }
        window.addEventListener('resize', resize); resize();

        // 🔬 Core Agent Sensing Logic
        function senseTrail(agent, angleOffset) {
            let senseAngle = agent.heading + angleOffset;
            let sx = Math.floor(agent.x + Math.cos(senseAngle) * SENSOR_DIST);
            let sy = Math.floor(agent.y + Math.sin(senseAngle) * SENSOR_DIST);
            
            // Safe array boundary containment wrapping checks
            if (sx >= 0 && sx < W && sy >= 0 && sy < H) {
                return trailMap[sy * W + sx];
            }
            return 0;
        }

        // 🌀 Fluid Dynamic Approximation & Render Loop
        function loop() {
            // 1. Process Chemical Footprint Evaporation and Diffusion Matrix Checks
            for (let y = 1; y < H - 1; y++) {
                for (let x = 1; x < W - 1; x++) {
                    let idx = y * W + x;
                    
                    // Standard 3x3 box blur diffusion kernel logic
                    let sum = trailMap[idx] +
                              trailMap[idx - 1] + trailMap[idx + 1] +
                              trailMap[idx - W] + trailMap[idx + W];
                    
                    // Factor in structural decay evaporation multipliers
                    nextMap[idx] = (sum / 5) * 0.94; 
                }
            }
            // Swap array memory buffer tracks instantly
            trailMap.set(nextMap);

            // 2. Drive and Steer Autonomous Slime Micro-agents
            for (let i = 0; i < agents.length; i++) {
                const a = agents[i];

                // Mouse interaction repulsion wave vector injection
                let dx = mx - a.x, dy = my - a.y;
                let distSq = dx * dx + dy * dy;
                if (distSq < 9000 && distSq > 0) {
                    let forceAng = Math.atan2(dy, dx);
                    // Forcefully divert headings away from cursor focus line coordinate bounds
                    a.heading = forceAng + Math.PI + (Math.random() - 0.5) * 0.5;
                    if (isMouseDown) { a.x += Math.cos(a.heading) * 4; a.y += Math.sin(a.heading) * 4; }
                }

                // Radar scan: Left, Center, Right chemical density evaluation fields
                let sCenter = senseTrail(a, 0);
                let sLeft = senseTrail(a, -SENSOR_ANGLE);
                let sRight = senseTrail(a, SENSOR_ANGLE);

                if (sCenter > sLeft && sCenter > sRight) {
                    // Keep existing heading tracking straight paths
                } else if (sLeft > sRight) {
                    a.heading -= TURN_SPEED * Math.random();
                } else if (sRight > sLeft) {
                    a.heading += TURN_SPEED * Math.random();
                } else {
                    a.heading += (Math.random() - 0.5) * 0.4; // Ambient random meandering noise
                }

                // Progress step variables forward
                a.x += Math.cos(a.heading) * AGENT_SPEED;
                a.y += Math.sin(a.heading) * AGENT_SPEED;

                // Bounce off viewport boundaries smoothly
                if (a.x < 0 || a.x >= W) { a.x = Math.max(0, Math.min(W - 1, a.x)); a.heading = Math.PI - a.heading; }
                if (a.y < 0 || a.y >= H) { a.y = Math.max(0, Math.min(H - 1, a.y)); a.heading = -a.heading; }

                // Stamp current coordinate location pixel onto trailMap layer array matrix
                let curIdx = Math.floor(a.y) * W + Math.floor(a.x);
                if (curIdx >= 0 && curIdx < trailMap.length) {
                    trailMap[curIdx] = 255; 
                }
            }

            // 3. Flatten memory state structure data out onto canvas context buffers
            let imgData = ctx.createImageData(W, H);
            let d = imgData.data;

            for (let i = 0; i < trailMap.length; i++) {
                let val = trailMap[i];
                let idx = i * 4;
                
                // Neon Bio-Luminescent Slime Color Profile (Emerald Green to Aqua Cyan blending)
                d[idx] = Math.floor(val * 0.1);      // Low Red
                d[idx + 1] = Math.floor(val * 0.95); // Intense Green
                d[idx + 2] = Math.floor(val * 0.8);  // Cyan undertone
                d[idx + 3] = 255;                    // Opacity lock
            }
            ctx.putImageData(imgData, 0, 0);

            requestAnimationFrame(loop);
        }

        // 🖱️ Event Capture Processing Matrix
        window.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
        window.addEventListener('mousedown', () => isMouseDown = true);
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mouseout', () => { mx = -1000; my = -1000; isMouseDown = false; });

        // Kick off calculations instantly
        loop();
    </script>
</body>
</html>
