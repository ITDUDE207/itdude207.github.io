<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Python Async REPL</title>
    <!-- Xterm.js Styles and Scripts -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <script src="https://jsdelivr.net"></script>
    <!-- Pyodide Core -->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
    <style>
        body { background-color: #1a1a1a; margin: 0; padding: 20px; font-family: monospace; }
        #terminal-container { width: 100%; height: 85vh; background: #000; padding: 10px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="terminal-container"></div>

<script>
    let pyodide;
    let term;
    let currentLine = "";
    const prompt = ">>> ";

    // Initialize the Terminal UI
    term = new Terminal({
        cursorBlink: true,
        fontFamily: 'Courier New, Courier, monospace',
        fontSize: 14,
        theme: { background: '#1e1e1e', foreground: '#f8f8f2', cursor: '#f8f8f0' }
    });
    term.open(document.getElementById('terminal-container'));
    term.writeln("Initializing WebAssembly environment. Please wait...");

    // Initialize Pyodide & Micropip
    async function initPython() {
        try {
            pyodide = await loadPyodide({
                stdout: (text) => term.writeln(text),
                stderr: (text) => term.writeln(`\x1b[31m${text}\x1b[0m`) // Red color for errors
            });
            
            term.writeln("Loading micropip package manager...");
            await pyodide.loadPackage("micropip");
            
            // Expose a helper to Python so it can print without adding extra newlines
            pyodide.runPython(`
                import sys
                from js import term
                class TerminalStdout:
                    def write(self, text):
                        # Convert newline characters to proper terminal return carriages
                        term.write(text.replace('\\n', '\\r\\n'))
                    def flush(self):
                        pass
                sys.stdout = TerminalStdout()
                sys.stderr = TerminalStdout()
            `);

            term.writeln("\x1b[32mPyodide Python 3 Shell Ready!\x1b[0m");
            term.writeln("Try running: import micropip; await micropip.install('regex')\r\n");
            term.write(prompt);
            setupInputHandling();
        } catch (err) {
            term.writeln(`\x1b[31mInitialization failed: ${err.message}\x1b[0m`);
        }
    }

    // Process user interactive key bindings
    function setupInputHandling() {
        term.onKey(async e => {
            const printable = !e.domEvent.altKey && !e.domEvent.altGraphKey && !e.domEvent.ctrlKey && !e.domEvent.metaKey;

            if (e.domEvent.key === 'Enter') {
                term.write('\r\n');
                if (currentLine.trim()) {
                    await executePythonCode(currentLine);
                } else {
                    term.write(prompt);
                }
                currentLine = "";
            } else if (e.domEvent.key === 'Backspace') {
                // Prevent deleting the prompt symbol
                if (currentLine.length > 0) {
                    currentLine = currentLine.slice(0, -1);
                    term.write('\b \b');
                }
            } else if (printable) {
                currentLine += e.key;
                term.write(e.key);
            }
        });
    }

    // Asynchronously compile and evaluate raw strings
    async function executePythonCode(code) {
        try {
            // runPythonAsync acts directly as an async execution runtime loop supporting top-level await 
            let result = await pyodide.runPythonAsync(code);
            if (result !== undefined && result !== null) {
                term.writeln(String(result));
            }
        } catch (err) {
            term.writeln(`\x1b[31mError: ${err.message}\x1b[0m`);
        }
        term.write(prompt);
    }

    initPython();
</script>
</body>
</html>
