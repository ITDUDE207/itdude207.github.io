<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Python Shell with Micropip</title>
    <!-- Load Pyodide from CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 20px;
        }
        h2 { color: #4ec9b0; }
        #status {
            color: #ce9178;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #console-log {
            background-color: #252526;
            border: 1px solid #3c3c3c;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            white-space: pre-wrap;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        textarea {
            flex-grow: 1;
            background-color: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #9cdcfe;
            font-family: inherit;
            padding: 10px;
            resize: vertical;
            height: 60px;
            border-radius: 4px;
        }
        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #1177bb;
        }
    </style>
</head>
<body>

    <h2>🐍 Pyodide Browser Shell</h2>
    <div id="status">Status: Initializing WebAssembly environment...</div>

    <div id="console-log">Welcome! Please wait for Pyodide to load before running code.</div>

    <div class="input-area">
        <textarea id="code-input" placeholder="Type Python code here... (Try: import micropip; await micropip.install('regex'))" disabled></textarea>
        <button id="run-btn" onclick="runPython()" disabled>Run</button>
    </div>

<script>
    let pyodide;
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('console-log');
    const codeInput = document.getElementById('code-input');
    const runBtn = document.getElementById('run-btn');

    // Custom print redirect to capture standard output from Python
    function printToConsole(text) {
        logDiv.innerText += '\n' + text;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // 1. Initialise Pyodide and Micropip
    async function initPyodide() {
        try {
            // Load main runtime
            pyodide = await loadPyodide({
                stdout: printToConsole,
                stderr: printToConsole
            });
            
            statusDiv.innerText = "Status: Loading package manager (micropip)...";
            // Pre-load micropip into the environment
            await pyodide.loadPackage("micropip"); 
            
            statusDiv.innerText = "Status: Ready";
            statusDiv.style.color = "#4ec9b0";
            codeInput.disabled = false;
            runBtn.disabled = false;
            logDiv.innerText += "\nPyodide and micropip loaded. You can now execute async tasks!";
        } catch (err) {
            statusDiv.innerText = "Status: Initialization Failed";
            statusDiv.style.color = "#f44747";
            logDiv.innerText += `\nError during startup: ${err.message}`;
        }
    }

    // 2. Execute code asynchronously
    async function runPython() {
        const code = codeInput.value.trim();
        if (!code) return;

        printToConsole(`>>> ${code}`);
        runBtn.disabled = true;
        statusDiv.innerText = "Status: Executing...";

        try {
            // runPythonAsync allows top-level 'await' expressions needed for micropip
            let result = await pyodide.runPythonAsync(code);
            
            if (result !== undefined) {
                printToConsole(result);
            }
            statusDiv.innerText = "Status: Ready";
        } catch (err) {
            printToConsole(`Error: ${err.message}`);
            statusDiv.innerText = "Status: Execution Error";
        } finally {
            runBtn.disabled = false;
        }
    }

    // Start everything on page load
    initPyodide();
</script>
</body>
</html>
