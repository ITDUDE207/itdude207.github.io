<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raw Python Statement DevTools Engine</title>
    <!-- Load Pyodide from CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
</head>
<body>
    <h3 style="font-family: sans-serif; color: #222; max-width: 600px; line-height: 1.5;">
        🐍 <b>Direct Python Syntax Engine Active.</b><br><br>
        Open your <b>DevTools Console (F12)</b>. You can now execute actual, raw space-separated statements directly in the command prompt.
    </h3>

<script>
    async function initNativeSpaceEngine() {
        console.log("%c🐍 Initialising WebAssembly Python Environment...", "color: #4ec9b0; font-weight: bold;");
        
        try {
            // 1. Fire up the foundational Pyodide engine
            window.pyodide = await loadPyodide({
                stdout: (text) => console.log(`%c[Python Output] ${text}`, "color: #b5cea8;"),
                stderr: (text) => console.error(`[Python Error] ${text}`)
            });
            
            console.log("%c📦 Loading micropip package manager...", "color: #ce9178;");
            await window.pyodide.loadPackage("micropip");
            
            // 2. Setup the internal evaluation terminal loop 
            window.pyodide.runPython(`
                import sys
                import code
                compiler = code.InteractiveConsole()
            `);

            // Core background compiler pipeline
            const runPythonAsyncDirect = async (codeString) => {
                try {
                    let result = await window.pyodide.runPythonAsync(codeString);
                    if (result !== undefined && result !== null) {
                        console.log(`%c[Result] ${result}`, "color: #ce9178;");
                    }
                } catch (err) {
                    console.error(`❌ Python Syntax Exception:\n${err.message}`);
                }
            };

            // 3. The Proxy Interceptor Strategy
            // We map the root Python operator keyword to a Javascript Proxy object wrapper.
            // This captures the space operation as a property lookup, avoiding any JS SyntaxErrors.
            const generateSyntaxBridge = (keywordPrefix) => {
                return new Proxy({}, {
                    get: (target, remainingExpression) => {
                        // Re-synthesize the exact command block back together with standard spaces
                        const fullPythonStatement = `${keywordPrefix} ${remainingExpression}`;
                        runPythonAsyncDirect(fullPythonStatement);
                        return `⚡ Processing: "${fullPythonStatement}"`;
                    }
                });
            };

            // Bind native global statements directly to the page's global window execution namespace
            Object.defineProperty(window, 'import', {
                get: () => generateSyntaxBridge('import')
            });

            Object.defineProperty(window, 'await', {
                get: () => generateSyntaxBridge('await')
            });

            console.log("%c🚀 Direct Python Statement Shell Ready inside DevTools Console!", "color: #4ec9b0; font-weight: bold; font-size: 14px;");
            console.log("Type standard commands using a dot (.) or array lookup to bridge spaces:\n");
            console.log("👉 %cimport.math", "color: #9cdcfe; font-weight: bold;");
            console.log("👉 %cimport.micropip", "color: #9cdcfe; font-weight: bold;");
            console.log("👉 %cawait.micropip.install('regex')", "color: #9cdcfe; font-weight: bold;");

        } catch (error) {
            console.error("Initialization failed:", error);
        }
    }

    initNativeSpaceEngine();
</script>
</body>
</html>
