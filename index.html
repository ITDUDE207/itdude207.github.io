<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python DevTools Console Engine</title>
    <!-- Load Pyodide from CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
</head>
<body>
    <h3 style="font-family: sans-serif; color: #333;">
        🐍 Pyodide Console Engine Loaded. Open your <b>Browser DevTools (F12)</b> to use the shell!
    </h3>

<script>
    async function initDevToolsPython() {
        console.log("%c🐍 Initialising WebAssembly Python Environment...", "color: #4ec9b0; font-weight: bold;");
        
        try {
            // 1. Initialise Pyodide runtime and pipe stdout/stderr directly into native console logs
            window.pyodide = await loadPyodide({
                stdout: (text) => console.log(`%c[Python Output] ${text}`, "color: #b5cea8;"),
                stderr: (text) => console.error(`[Python Error] ${text}`)
            });
            
            console.log("%c📦 Loading micropip package manager...", "color: #ce9178;");
            await window.pyodide.loadPackage("micropip");
            
            // 2. Initialise the native InteractiveCompiler engine block inside Pyodide
            window.pyodide.runPython(`
                import sys
                import code
                compiler = code.InteractiveConsole()
            `);

            // 3. Define the evaluation window binding rule for multi-line inputs
            window.py = async function(strings, ...values) {
                // Support both tagged template literals (py`code`) and standard strings (py("code"))
                let code = typeof strings === 'string' ? strings : strings.reduce((result, str, i) => result + str + (values[i] || ''), '');
                code = code.trim();

                if (!code) return;

                try {
                    // Check if block structure is valid or requires more continuation syntax
                    window.pyodide.globals.set("test_code_str", code);
                    const needsMoreInput = window.pyodide.runPython('compiler.compile(test_code_str, "<input>", "single")');
                    
                    if (needsMoreInput) {
                        console.warn("⚠️ Warning: Incomplete block statement (e.g. unclosed loop or def layout). Make sure your block is complete!");
                    }

                    // Execute asynchronously to maintain top-level 'await' support for micropip
                    let result = await window.pyodide.runPythonAsync(code);
                    if (result !== undefined && result !== null) {
                        console.log(result);
                    }
                } catch (err) {
                    console.error(`❌ Evaluation Error:\n${err.message}`);
                }
            };

            console.log("%c🚀 Pyodide Python 3 Shell Ready inside DevTools!", "color: #4ec9b0; font-weight: bold; font-size: 14px;");
            console.log("Run scripts using JavaScript backticks: %cpy`your_code_here`%c", "color: #9cdcfe; font-weight: bold;", "");
            
        } catch (error) {
            console.error("Initialization failed:", error);
        }
    }

    // Run configuration automatically on DOM loading window state
    initDevToolsPython();
</script>
</body>
</html>
