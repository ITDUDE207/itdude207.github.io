<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Python Async REPL with Multi-line Support</title>
    <!-- Xterm.js Styles and Scripts -->
    <script src="
https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js
"></script>
<link href="
https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css
" rel="stylesheet">
    <!-- Pyodide Core -->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
    <style>
        body { background-color: #1a1a1a; margin: 0; padding: 20px; font-family: monospace; }
        #terminal-container { width: 100%; height: 85vh; background: #000; padding: 10px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="terminal-container"></div>

<script>
    let pyodide;
    
    // UI Prompt Configurations
    const PROMPT_PRIMARY = ">>> ";
    const PROMPT_CONTINUE = "... ";
    let activePrompt = PROMPT_PRIMARY;

    // Buffer tracking and line storage
    let currentLine = "";
    let linesBuffer = [];
    let commandHistory = [];
    let historyIndex = -1;

    // Initialize the Terminal UI globally on the window object so Pyodide can see it
    window.term = new Terminal({
        cursorBlink: true,
        fontFamily: 'Courier New, Courier, monospace',
        fontSize: 14,
        theme: { background: '#1e1e1e', foreground: '#f8f8f2', cursor: '#f8f8f0' }
    });
    term.open(document.getElementById('terminal-container'));
    term.writeln("Initializing WebAssembly environment. Please wait...");

    // Initialize Pyodide & Micropip
    async function initPython() {
        try {
            pyodide = await loadPyodide({
                stdout: (text) => term.writeln(text),
                stderr: (text) => term.writeln(`\x1b[31m${text}\x1b[0m`)
            });
            
            term.writeln("Loading micropip package manager...");
            await pyodide.loadPackage("micropip");
            
            // Redirect Python stdout/stderr and load code compiler helpers
            pyodide.runPython(`
                import sys
                import code
                from js import term

                class TerminalStdout:
                    def write(self, text):
                        term.write(text.replace('\\n', '\\r\\n'))
                    def flush(self):
                        pass

                sys.stdout = TerminalStdout()
                sys.stderr = TerminalStdout()

                # Compiler engine instance to inspect partial code lines
                compiler = code.Compile()
            `);

            term.writeln("\x1b[32mPyodide Python 3 Multi-line Shell Ready!\x1b[0m");
            term.writeln("Try typing a multi-line loop or function definition.");
            term.writeln("Press Enter on a blank line to execute a block.\r\n");
            term.write(activePrompt);
            setupInputHandling();
        } catch (err) {
            term.writeln(`\x1b[31mInitialization failed: ${err.message}\x1b[0m`);
        }
    }

    // Process user interactive key bindings
    function setupInputHandling() {
        term.onKey(async e => {
            const key = e.domEvent.key;
            const printable = !e.domEvent.altKey && !e.domEvent.altGraphKey && !e.domEvent.ctrlKey && !e.domEvent.metaKey;

            if (key === 'Enter') {
                term.write('\r\n');
                await handleLineSubmission();
            } else if (key === 'Backspace') {
                // Prevent deleting past the current prompt symbols
                if (currentLine.length > 0) {
                    currentLine = currentLine.slice(0, -1);
                    term.write('\b \b');
                }
            } else if (key === 'ArrowUp') {
                handleHistory(-1);
            } else if (key === 'ArrowDown') {
                handleHistory(1);
            } else if (printable) {
                currentLine += e.key;
                term.write(e.key);
            }
        });
    }

    // Handles history navigation (up/down arrow)
    function handleHistory(direction) {
        if (commandHistory.length === 0) return;

        // Clear current active line text visually
        for (let i = 0; i < currentLine.length; i++) {
            term.write('\b \b');
        }

        historyIndex += direction;
        
        // Bounds checking
        if (historyIndex < 0) {
            historyIndex = -1;
            currentLine = "";
        } else if (historyIndex >= commandHistory.length) {
            historyIndex = commandHistory.length;
            currentLine = "";
        } else {
            currentLine = commandHistory[commandHistory.length - 1 - historyIndex];
        }

        term.write(currentLine);
    }

    // Intercepts single line submits and determines code compilation state
    async function handleLineSubmission() {
        const trimmedLine = currentLine.trim();
        linesBuffer.push(currentLine);
        
        // Build current state compound string
        const testSourceCode = linesBuffer.join('\n');

        // Reset history pointer back to idle
        historyIndex = -1;

        // Global state variable checking if python needs more context parsing strings
        let dynamicStatus = "single"; 

        if (testSourceCode.trim().length > 0) {
            try {
                // Safely evaluate python code snippet compilation state via Pyodide globals
                pyodide.globals.set("test_code_str", testSourceCode);
                dynamicStatus = pyodide.runPython(`
                    try:
                        # Try to compile code block
                        res = compiler(test_code_str, "<input>", "single")
                        # Returns None if code block statement incomplete (e.g. requires indentation)
                        "single" if res is not None else "incomplete"
                    except (OverflowError, SyntaxError, ValueError):
                        "invalid"
                `);
            } catch (err) {
                dynamicStatus = "invalid";
            }
        }

        // Processing rules matching native python compilation engine states
        if (dynamicStatus === "incomplete" || (activePrompt === PROMPT_CONTINUE && trimmedLine.length > 0)) {
            // Keep block open, switch to continuation prompt
            activePrompt = PROMPT_CONTINUE;
            currentLine = "";
            term.write(activePrompt);
        } else {
            // Block is complete or syntax is invalid. Save history and run code
            const fullCommandBlock = linesBuffer.join('\n');
            
            if (fullCommandBlock.trim()) {
                commandHistory.push(fullCommandBlock);
            }

            // Execute the code buffer
            if (fullCommandBlock.trim().length > 0) {
                await executePythonCode(fullCommandBlock);
            } else {
                term.write(PROMPT_PRIMARY);
            }

            // Reset local execution buffers
            linesBuffer = [];
            currentLine = "";
            activePrompt = PROMPT_PRIMARY;
        }
    }

    // Asynchronously compile and evaluate accumulated code block strings
    async function executePythonCode(code) {
        try {
            let result = await pyodide.runPythonAsync(code);
            if (result !== undefined && result !== null) {
                term.writeln(String(result));
            }
        } catch (err) {
            term.writeln(`\x1b[31mError: ${err.message}\x1b[0m`);
        }
        term.write(PROMPT_PRIMARY);
    }

    initPython();
</script>
</body>
</html>
