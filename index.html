<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ThonnyPad</title>

    <!-- Brython -->
    <script src="./brython.js"></script>
    <script src="./brython_stdlib.js"></script>

    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;

            height: 100vh;
        }

        .toolbar {
            background: #2d2d2d;
            padding: 10px;

            display: flex;
            gap: 10px;
        }

        button {
            border: 0;
            border-radius: 6px;

            padding: 10px 16px;

            background: #4caf50;
            color: white;

            font-weight: bold;
            font-size: 15px;
        }

        .clear {
            background: #f44336;
        }

        #code {
            flex: 1;

            width: 100%;

            box-sizing: border-box;

            resize: none;
            border: 0;
            outline: none;

            padding: 15px;

            background: #151515;
            color: #d4d4d4;

            font-family: monospace;
            font-size: 17px;
            line-height: 1.5;
        }

        .label {
            background: #2d2d2d;

            padding: 7px 12px;

            color: #aaa;

            font-size: 12px;
            text-transform: uppercase;
        }

        #output {
            height: 30%;

            box-sizing: border-box;

            padding: 15px;

            background: #000;
            color: #00ff00;

            font-family: monospace;
            font-size: 15px;

            white-space: pre-wrap;

            overflow-y: auto;
        }
    </style>
</head>


<body onload="brython()">

    <div class="toolbar">

        <button onclick="runPython()">
            ▶ Run Code
        </button>

        <button
            class="clear"
            onclick="clearConsole()"
        >
            🗑 Clear
        </button>

    </div>


    <div class="label">
        Editor — main.py
    </div>


    <textarea id="code">print("Hello from Brython!")

for i in range(5):
    print("Step", i)</textarea>


    <div class="label">
        Shell / Output
    </div>


    <div id="output"></div>


    <script>

        function clearConsole() {
            document.getElementById(
                "output"
            ).textContent = "";
        }


        function runPython() {

            const code =
                document.getElementById(
                    "code"
                ).value;

            const output =
                document.getElementById(
                    "output"
                );


            output.textContent =
                "=== Running Script ===\n";


            /*
             * Create a temporary Brython
             * Python script.
             */

            const script =
                document.createElement(
                    "script"
                );


            script.type =
                "text/python";


            /*
             * Redirect Python's print()
             * into our output box.
             */

            script.textContent = `

from browser import document
import sys


class Output:

    def write(self, text):
        document["output"].textContent += text

    def flush(self):
        pass


sys.stdout = Output()
sys.stderr = Output()


try:

${code.split("\n")
    .map(line => "    " + line)
    .join("\n")}

except Exception as e:

    print(
        type(e).__name__ + ": " + str(e)
    )

`;


            document.body.appendChild(
                script
            );


            /*
             * Remove the temporary script
             * after Brython has processed it.
             */

            setTimeout(
                () => script.remove(),
                100
            );

        }

    </script>

</body>

</html>
