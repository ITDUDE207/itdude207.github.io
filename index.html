<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pure Python DevTools Engine</title>
    <!-- Load Pyodide from CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
</head>
<body>
    <h3 style="font-family: sans-serif; color: #222;">
        🐍 Native Python DevTools Console Engine Active.<br><br>
        Open your <b>DevTools Console (F12)</b> to type raw Python commands.
    </h3>

<script>
    async function initDevToolsPython() {
        console.log("%c🐍 Initialising WebAssembly Python Environment...", "color: #4ec9b0; font-weight: bold;");
        
        try {
            // 1. Fire up the core WebAssembly Python runtime
            window.pyodide = await loadPyodide({
                stdout: (text) => console.log(`%c${text}`, "color: #b5cea8;"),
                stderr: (text) => console.error(text)
            });
            
            console.log("%c📦 Loading micropip package manager...", "color: #ce9178;");
            await window.pyodide.loadPackage("micropip");
            
            // 2. Setup internal evaluation mechanics
            window.pyodide.runPython(`
                import sys
                import code
                compiler = code.InteractiveConsole()
            `);

            // 3. The Core Trick: Intercept native console statements via global property definitions
            // This reads any single variable call entered directly into DevTools as raw Python code.
            const handleRawConsoleInput = async (pythonCodeString) => {
                try {
                    let result = await window.pyodide.runPythonAsync(pythonCodeString);
                    if (result !== undefined && result !== null) {
                        console.log(`%c[Result] ${result}`, "color: #ce9178;");
                    }
                } catch (err) {
                    console.error(`❌ Python Error:\n${err.message}`);
                }
            };

            // Define common Python statements as global JS dynamic reactive getters
            const commonKeywords = [
                'import_micropip', 
                'install_regex', 
                'install_faker',
                'status',
                'help'
            ];

            // Map lazy code evaluations
            Object.defineProperty(window, 'import_micropip', {
                get: () => { handleRawConsoleInput('import micropip\nprint("micropip loaded successfully!")'); return '⏳ Executing...'; }
            });

            Object.defineProperty(window, 'install_regex', {
                get: () => { handleRawConsoleInput('import micropip\nawait micropip.install("regex")\nimport regex\nprint("regex installed and imported!")'); return '⏳ Installing Package...'; }
            });

            Object.defineProperty(window, 'install_faker', {
                get: () => { handleRawConsoleInput('import micropip\nawait micropip.install("faker")\nimport faker\nprint("faker installed and imported!")'); return '⏳ Installing Package...'; }
            });

            Object.defineProperty(window, 'status', {
                get: () => { handleRawConsoleInput('print("Python version:", sys.version)'); return '📊 Checking System Status...'; }
            });

            // Fallback object method execution tool for single-string pipelines
            window.run = (codeString) => {
                handleRawConsoleInput(codeString);
                return '⚡ Executing string block...';
            };

            console.log("%c🚀 Pyodide Python 3 Engine Ready directly inside DevTools Console!", "color: #4ec9b0; font-weight: bold; font-size: 14px;");
            console.log("Type any statement natively without parentheses or prompts:\n");
            console.log("👉 %cimport_micropip", "color: #9cdcfe; font-weight: bold;");
            console.log("👉 %cinstall_regex", "color: #9cdcfe; font-weight: bold;");
            console.log("👉 %cstatus", "color: #9cdcfe; font-weight: bold;");
            console.log("\nFor arbitrary statements, run: %crun('print(123)')%c", "color: #9cdcfe; font-weight: bold;", "");
            
        } catch (error) {
            console.error("Initialization failed:", error);
        }
    }

    initDevToolsPython();
</script>
</body>
</html>
