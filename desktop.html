<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖥️ WebAssembly x86 Terminal</title>
    <!-- Load v86 library from CDN -->
    <script src="https://unpkg.com/v86@0.2.0/lib/v86.js"></script>
    <!-- Load your configuration script -->
    <script src="vm.js" defer></script>
    <style>
        body { background: #3b7a7a; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; overflow: hidden; }
        #vm-window { width: 720px; background: #c0c0c0; border: 3px solid; border-color: #fff #808080 #808080 #fff; padding: 3px; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }
        .title-bar { background: linear-gradient(90deg, #000080, #1084d0); color: white; padding: 4px 8px; font-weight: bold; display: flex; justify-content: space-between; font-size: 0.9rem; }
        #terminal-container { background: #000; color: #aaa; padding: 10px; height: 380px; font-family: monospace; font-size: 14px; overflow: auto; white-space: pre-wrap; border: 2px solid #808080; }
        .hud { width: 720px; display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.85rem; color: #111; font-weight: bold; background: rgba(255,255,255,0.3); padding: 6px; box-sizing: border-box; border-radius: 4px; }
        #terminal-container::-webkit-scrollbar { width: 8px; background: #333; }
        #terminal-container::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
    </style>
</head>
<body>
    <h2 style="margin: 0 0 15px 0; text-shadow: 1px 1px #000;">WASM OS DECK</h2>
    <div id="vm-window">
        <div class="title-bar">
            <span>📟 Bash Terminal (Guest OS: Linux Kernel)</span>
            <span style="cursor:pointer;" onclick="location.reload()">[REBOOT]</span>
        </div>
        <div id="terminal-container">Initializing WebAssembly core environment threads...</div>
    </div>
    <div class="hud">
        <div>CORE STATE: <span id="vm-state" style="color: #600;">LOADING SECTORS...</span></div>
        <div>FOOTPRINT: 32MB ALLOCATED</div>
    </div>
</body>
</html>
