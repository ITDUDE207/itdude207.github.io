<!DOCTYPE html>
<html>
<head>
    <title>🐜 Master Ant</title>
    <style>
        body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#12100e;font-family:monospace;user-select:none;}
        canvas{display:block;width:100vw;height:100vh;cursor:crosshair;}
        #hud{position:fixed;top:12px;left:12px;background:rgba(0,0,0,0.9);padding:12px;border-radius:4px;border:1px solid:#ffaa00;z-index:100;display:flex;flex-direction:column;gap:4px;font-size:0.8rem;}
        button{background:#221a15;color:#ffaa00;border:1px solid #ffaa00;padding:6px;font-weight:bold;cursor:pointer;font-family:inherit;}
    </style>
</head>
<body>
    <div id="hud">
        <div style="color:#ffaa00;font-weight:bold;">🐜 ANTS: <span id="pop">750</span> | 🪲 BEETLES: <span id="en">0</span></div>
        <button id="mode" onclick="cycle()">MODE: FOOD (1)</button>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),mBtn=document.getElementById('mode'),pDisp=document.getElementById('pop'),eDisp=document.getElementById('en');
        let W,H,ants=[],food=[],bombs=[],beetles=[],hX,hY,pHome,pFood,gW,gH,isDn=false,ac=null;
        let modes=["food","graffiti","bomb","enemy"],mIdx=0;const S=5;
        function resize(){
            W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;hX=W/2;hY=H/2;gW=Math.ceil(W/S);gH=Math.ceil(H/S);
            pHome=Array(gH).fill().map(()=>new Float32Array(gW));pFood=Array(gH).fill().map(()=>new Float32Array(gW));
            ants=Array(750).fill().map(()=>({x:hX,y:hY,a:Math.random()*Math.PI*2,f:false}));
        }
        window.addEventListener('resize',resize);resize();
        function setMode(idx){mIdx=idx;mBtn.innerText="MODE: "+modes[mIdx].toUpperCase()+" ("+(mIdx+1)+")";mBtn.style.color=mIdx==1?"#f0f":mIdx==2?"#f36":mIdx==3?"#a0f":"#fa0";mBtn.style.borderColor=mBtn.style.color;}
        function cycle(){setMode((mIdx+1)%4);}
        function snd(f,t,d=0.08){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;if(t==='sawtooth')o.frequency.exponentialRampToValueAtTime(30,ac.currentTime+d);g.gain.setValueAtTime(0.015,ac.currentTime);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
        function loop(){
            for(let y=0;y<gH;y++)for(let x=0;x<gW;x++){pHome[y][x]*=0.99;pFood[y][x]*=0.995;}
            for(let i=bombs.length-1;i>=0;i--){
                let b=bombs[i];b.r+=5;if(b.r>85){bombs.splice(i,1);continue;}
                for(let e=beetles.length-1;e>=0;e--)if(Math.hypot(beetles[e].x-b.x,beetles[e].y-b.y)<b.r+10){beetles.splice(e,1);eDisp.innerText=beetles.length;snd(140,'sawtooth',0.2);}
            }
            beetles.forEach(b=>{b.a+=(Math.random()-0.5)*0.35;b.x+=Math.cos(b.a)*1.3;b.y+=Math.sin(b.a)*1.3;if(b.x<15||b.x>W-15)b.a=Math.PI-b.a;if(b.y<15||b.y>H-15)b.a=-b.a;});
            for(let i=ants.length-1;i>=0;i--){
                const ant=ants[i];let gx=Math.max(0,Math.min(gW-1,Math.floor(ant.x/S))),gy=Math.max(0,Math.min(gH-1,Math.floor(ant.y/S)));
                let crushed=false;
                for(let e=0;e<beetles.length;e++)if(Math.hypot(beetles[e].x-ant.x,beetles[e].y-ant.y)<13){ants.splice(i,1);pDisp.innerText=ants.length;snd(180,'square',0.04);crushed=true;break;}
                if(crushed)continue;
                bombs.forEach(b=>{if(Math.hypot(ant.x-b.x,ant.y-b.y)<b.r){ant.a=Math.atan2(ant.y-b.y,ant.x-b.x);ant.x+=Math.cos(ant.a)*6;ant.y+=Math.sin(ant.a)*6;}});
                if(ant.f){
                    pFood[gy][gx]=Math.max(pFood[gy][gx],10);ant.a+=(Math.atan2(hY-ant.y,hX-ant.x)-ant.a)*0.15;
                    if(Math.hypot(hX-ant.x,hY-ant.y)<12){ant.f=false;ant.a+=Math.PI;}
                }else{
                    pHome[gy][gx]=Math.max(pHome[gy][gx],10);let l=ant.a-0.4,r=ant.a+0.4;
                    let scent=(ang)=>{let sx=Math.floor((ant.x+Math.cos(ang)*11)/S),sy=Math.floor((ant.y+Math.sin(ang)*11)/S);return(sx>=0&&sx<gW&&sy>=0&&sy<gH)?pFood[sy][sx]:0;};
                    if(scent(l)>scent(r))ant.a-=0.1;else if(scent(r)>scent(l))ant.a+=0.1;else ant.a+=(Math.random()-0.5)*0.45;
                    food.forEach((p,idx)=>{if(Math.hypot(p.x-ant.x,p.y-ant.y)<p.r){ant.f=true;ant.a+=Math.PI;p.r-=0.05;if(p.r<2)food.splice(idx,1);}});
                }
                ant.x+=Math.cos(ant.a)*2;ant.y+=Math.sin(ant.a)*2;
                if(ant.x<0||ant.x>W)ant.a=Math.PI-ant.a;if(ant.y<0||ant.y>H)ant.a=-ant.a;
            }
            ctx.fillStyle='#12100e';ctx.fillRect(0,0,W,H);
            for(let y=0;y<gH;y++)for(let x=0;x<gW;x++)if(pFood[y][x]>0.1){ctx.fillStyle=`rgba(255,0,255,${pFood[y][x]*0.035})`;ctx.fillRect(x*S,y*S,S,S);}
            ctx.fillStyle='#4a2f13';ctx.beginPath();ctx.arc(hX,hY,12,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#ffaa00';food.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
            ctx.strokeStyle='#ff3366';ctx.lineWidth=2.5;bombs.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();});
            beetles.forEach(b=>{ctx.fillStyle='#3a005c';ctx.beginPath();ctx.arc(b.x,b.y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a600ff';ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();});
            ants.forEach(ant=>{ctx.fillStyle=ant.f?'#ffaa00':'#8c8276';ctx.fillRect(ant.x,ant.y,1.5,1.5);});
            requestAnimationFrame(loop);
        }
        function act(e){
            if(e.clientX<240&&e.clientY<140)return;const m=modes[mIdx];
            if(m==="graffiti"){
                let gx=Math.floor(e.clientX/S),gy=Math.floor(e.clientY/S);
                for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let ny=gy+dy,nx=gx+dx;if(nx>=0&&nx<gW&&ny>=0&&ny<gH)pFood[ny][nx]=15;}
                if(Math.random()>0.88)snd(480,'sine');
            }
        }
        window.addEventListener('mousedown',(e)=>{
            isDn=true;if(e.clientX<240&&e.clientY<140)return;const m=modes[mIdx];
            if(m==="food"){food.push({x:e.clientX,y:e.clientY,r:18});snd(400,'sine');}
            else if(m==="bomb"){bombs.push({x:e.clientX,y:e.clientY,r:5});snd(100,'sawtooth',0.25);for(let i=food.length-1;i>=0;i--)if(Math.hypot(food[i].x-e.clientX,food[i].y-e.clientY)<65)food.splice(i,1);}
            else if(m==="enemy"){beetles.push({x:e.clientX,y:e.clientY,angle:Math.random()*Math.PI*2});eDisp.innerText=beetles.length;snd(500,'triangle');}
            else{act(e);}
        });
        window.addEventListener('mousemove',(e)=>{if(isDn)act(e);});window.addEventListener('mouseup',()=>isDn=false);
        window.addEventListener('keydown',(e)=>{if(e.key>="1"&&e.key<="4")setMode(parseInt(e.key)-1);});
        requestAnimationFrame(loop);
    </script>
</body>
</html>
