<!DOCTYPE html>
<html>
<head>
    <title>🐜 Micro Ant Colony</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #12100e; font-family: monospace; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
        #hud { position: fixed; top: 15px; left: 15px; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 4px; border: 1px solid #ffaa00; z-index: 100; display: flex; flex-direction: column; gap: 5px; }
        button { background: #221a15; color: #ffaa00; border: 1px solid #ffaa00; padding: 5px 10px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="hud">
        <div style="color:#ffaa00; font-weight:bold; font-size:0.85rem;">🐜 ANT POP: <span id="pop">600</span> | 🪲 BEETLES: <span id="en">0</span></div>
        <button id="mode" onclick="cycle()">MODE: FOOD</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'), mBtn = document.getElementById('mode'), pDisp = document.getElementById('pop'), eDisp = document.getElementById('en');
        let W, H, ants = [], food = [], bombs = [], beetles = [], hX, hY, pHome, pFood, gW, gH;
        let modes = ["food", "bomb", "enemy"], mIdx = 0, ac = null;
        const S = 5; // Matrix compression scaling factor

        function resize() {
            W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
            hX = W / 2; hY = H / 2; gW = Math.ceil(W/S); gH = Math.ceil(H/S);
            pHome = Array(gH).fill().map(() => new Float32Array(gW));
            pFood = Array(gH).fill().map(() => new Float32Array(gW));
            ants = Array(600).fill().map(() => ({ x: hX, y: hY, a: Math.random() * Math.PI * 2, f: false }));
        }
        window.addEventListener('resize', resize); resize();

        function cycle() { mIdx = (mIdx + 1) % 3; mBtn.innerText = "MODE: " + modes[mIdx].toUpperCase(); }

        function snd(f, t) {
            try {
                if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
                let o = ac.createOscillator(), g = ac.createGain(); o.type = t; o.frequency.value = f;
                g.gain.setValueAtTime(0.02, ac.currentTime); o.connect(g); g.connect(ac.destination);
                o.start(); o.stop(ac.currentTime + 0.1);
            } catch(e) {}
        }

        function loop() {
            // Fade pheromone traces cleanly
            for (let y = 0; y < gH; y++) for (let x = 0; x < gW; x++) { pHome[y][x] *= 0.99; pFood[y][x] *= 0.99; }

            // 1. Process Active Explosions
            for (let i = bombs.length - 1; i >= 0; i--) {
                let b = bombs[i]; b.r += 5;
                if (b.r > 80) { bombs.splice(i, 1); continue; }
                // Bombs target and destroy Beetle units inside the explosion radius
                for (let e = beetles.length - 1; e >= 0; e--) {
                    if (Math.hypot(beetles[e].x - b.x, beetles[e].y - b.y) < b.r + 10) { beetles.splice(e, 1); eDisp.innerText = beetles.length; snd(150, 'sawtooth'); }
                }
            }

            // 2. Process Beetle Hostile Wandering
            beetles.forEach(b => { b.a += (Math.random() - 0.5) * 0.3; b.x += Math.cos(b.a) * 1.2; b.y += Math.sin(b.a) * 1.2; if (b.x<0||b.x>W) b.a=Math.PI-b.a; if (b.y<0||b.y>H) b.a=-b.a; });

            // 3. Process Foraging Ant Swarm
            for (let i = ants.length - 1; i >= 0; i--) {
                const ant = ants[i];
                let gx = Math.max(0, Math.min(gW - 1, Math.floor(ant.x / S))), gy = Math.max(0, Math.min(gH - 1, Math.floor(ant.y / S)));

                // Check coordinate hitboxes against beetles
                let dead = false;
                for (let e = 0; e < beetles.length; e++) {
                    if (Math.hypot(beetles[e].x - ant.x, beetles[e].y - ant.y) < 12) { ants.splice(i, 1); pDisp.innerText = ants.length; dead = true; break; }
                }
                if (dead) continue;

                // Explode shockwave push vectors
                bombs.forEach(b => { if (Math.hypot(ant.x - b.x, ant.y - b.y) < b.r) { ant.a = Math.atan2(ant.y - b.y, ant.x - b.x); ant.x += Math.cos(ant.a)*5; ant.y += Math.sin(ant.a)*5; } });

                if (ant.f) {
                    pFood[gy][gx] = Math.max(pFood[gy][gx], 10);
                    ant.a += (Math.atan2(hY - ant.y, hX - ant.x) - ant.a) * 0.15;
                    if (Math.hypot(hX - ant.x, hY - ant.y) < 12) { ant.f = false; ant.a += Math.PI; }
                } else {
                    pHome[gy][gx] = Math.max(pHome[gy][gx], 10);
                    // Standard forward radar navigation sensors
                    let l = ant.a - 0.4, r = ant.a + 0.4;
                    let scent = (ang) => {
                        let sx = Math.floor((ant.x + Math.cos(ang) * 10) / S), sy = Math.floor((ant.y + Math.sin(ang) * 10) / S);
                        return (sx >= 0 && sx < gW && sy >= 0 && sy < gH) ? pFood[sy][sx] : 0;
                    };
                    if (scent(l) > scent(r)) ant.a -= 0.1; else if (scent(r) > scent(l)) ant.a += 0.1; else ant.a += (Math.random() - 0.5) * 0.4;

                    food.forEach((p, idx) => {
                        if (Math.hypot(p.x - ant.x, p.y - ant.y) < p.r) { ant.f = true; ant.a += Math.PI; p.r -= 0.05; if (p.r < 2) food.splice(idx, 1); }
                    });
                }
                ant.x += Math.cos(ant.a) * 2; ant.y += Math.sin(ant.a) * 2;
                if (ant.x < 0 || ant.x > W) ant.a = Math.PI - ant.a; if (ant.y < 0 || ant.y > H) ant.a = -ant.a;
            }

            // 🎨 Fast Graphics Drawing Operations
            ctx.fillStyle = '#12100e'; ctx.fillRect(0, 0, W, H);
            for (let y = 0; y < gH; y++) for (let x = 0; x < gW; x++) {
                if (pFood[y][x] > 0.1) { ctx.fillStyle = `rgba(0, 243, 255, ${pFood[y][x] * 0.03})`; ctx.fillRect(x*S, y*S, S, S); }
            }
            ctx.fillStyle = '#4a2f13'; ctx.beginPath(); ctx.arc(hX, hY, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffaa00'; food.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); });
            ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 2; bombs.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke(); });
            beetles.forEach(b => { ctx.fillStyle = '#3a005c'; ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#a600ff'; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill(); });
            ants.forEach(ant => { ctx.fillStyle = ant.f ? '#ffaa00' : '#8c8276'; ctx.fillRect(ant.x, ant.y, 1.5, 1.5); });

            requestAnimationFrame(loop);
        }

        window.addEventListener('mousedown', (e) => {
            if (e.clientX < 200 && e.clientY < 90) return;
            if (modes[mIdx] === "food") { food.push({ x: e.clientX, y: e.clientY, r: 18 }); snd(400, 'sine'); }
            else if (modes[mIdx] === "bomb") { bombs.push({ x: e.clientX, y: e.clientY, r: 5 }); snd(100, 'sawtooth'); }
            else { beetles.push({ x: e.clientX, y: e.clientY, a: Math.random() * Math.PI * 2 }); eDisp.innerText = beetles.length; snd(500, 'triangle'); }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
